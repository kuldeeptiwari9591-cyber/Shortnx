<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — ShortNx</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/" class="logo">Short<span>Nx</span></a>
            <div><a href="/signup.html" class="navlink">Sign up</a></div>
        </nav>

        <main>
            <h1 style="margin-top:48px;">Log in</h1>
            <form id="loginForm" class="card" style="margin-top:24px;">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="255">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required maxlength="72">
                </div>
                <button type="submit" class="btn btn-accent">Log in</button>
                <p class="error-msg" id="errorMsg"></p>
                <p style="margin-top:16px; font-size:0.9rem; color:var(--ink-soft);">
                    No account? <a href="/signup.html">Sign up</a>
                </p>
            </form>
        </main>

        <footer><p>&copy; 2026 ShortNx.</p></footer>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorEl = document.getElementById('errorMsg');
            errorEl.classList.remove('show');
            const formData = new FormData(this);
            try {
                const res = await fetch('/api/login', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    errorEl.textContent = data.error || 'Login failed.';
                    errorEl.classList.add('show');
                    return;
                }
                window.location.href = '/dashboard.html';
            } catch (err) {
                errorEl.textContent = 'Network error. Please try again.';
                errorEl.classList.add('show');
            }
        });
    </script>
</body>
</html>
