<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — ShortNx</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/" class="logo">Short<span>Nx</span></a>
            <div>
                <a href="/shorten" class="navlink">New link</a>
                <button id="logoutBtn" class="btn btn-ghost">Log out</button>
            </div>
        </nav>

        <main>
            <h1 style="margin-top:48px;">Your links</h1>
            <table class="links-table" id="linksTable">
                <thead>
                    <tr>
                        <th>Short code</th>
                        <th>Destination</th>
                        <th>Clicks</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="linksBody">
                    <tr><td colspan="5">Loading…</td></tr>
                </tbody>
            </table>
        </main>

        <footer><p>&copy; 2026 ShortNx.</p></footer>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
