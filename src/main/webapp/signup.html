<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — ShortNx</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/" class="logo">Short<span>Nx</span></a>
            <div><a href="/login.html" class="navlink">Log in</a></div>
        </nav>

        <main>
            <h1 style="margin-top:48px;">Create your account</h1>
            <form id="signupForm" class="card" style="margin-top:24px;" method="post" action="/api/signup">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="255">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="72">
                </div>
                <button type="submit" class="btn btn-accent">Sign up</button>
                <p class="error-msg" id="errorMsg"></p>
                <p style="margin-top:16px; font-size:0.9rem; color:var(--ink-soft);">
                    Already have an account? <a href="/login.html">Log in</a>
                </p>
            </form>
        </main>

        <footer><p>&copy; 2026 ShortNx.</p></footer>
    </div>

    <script src="js/signup.js"></script>
</body>
</html>
